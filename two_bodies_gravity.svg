<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 680" width="980" height="680">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arrow-force" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f43f5e" />
    </marker>
    <marker id="arrow-vel" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-axis" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#64748b" />
    </marker>

    <!-- Radial Gradients for Gravitational Wells -->
    <radialGradient id="well-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="well-a" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#4ade80" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .bg { fill: #050814; }
    .axis-line { stroke: #475569; stroke-width: 1.5; stroke-dasharray: 8 5; opacity: 0.6; }
    .body-b { fill: #0f2b48; stroke: #38bdf8; stroke-width: 2.5; }
    .body-a { fill: #0f3824; stroke: #4ade80; stroke-width: 2; }
    .orbit-a { stroke: rgba(74, 222, 128, 0.35); stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }
    .orbit-b { stroke: rgba(56, 189, 248, 0.35); stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }
    .hill-sphere { stroke: rgba(251, 191, 36, 0.6); stroke-width: 1.8; stroke-dasharray: 4 3; fill: rgba(251, 191, 36, 0.04); }
    .roche-lobe { stroke: rgba(129, 140, 248, 0.45); stroke-width: 1.5; fill: none; }
    .vec-force { stroke: #f43f5e; stroke-width: 2.5; }
    .vec-vel { stroke: #38bdf8; stroke-width: 2.5; }
    .barycenter { fill: #fbbf24; stroke: #ffffff; stroke-width: 1.5; }
    .lagrange-pt { fill: #c084fc; stroke: #ffffff; stroke-width: 1.5; }
    .tri-line { stroke: rgba(192, 132, 252, 0.25); stroke-width: 1.2; stroke-dasharray: 3 3; }
    
    .text-title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #f8fafc; }
    .text-label { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #e2e8f0; }
    .sub-label { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; }
    .zone-tag { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 600; }
  </style>

  <!-- Background -->
  <rect width="980" height="680" class="bg" />

  <!-- Gravitational Potential Wells (Faded Glow) -->
  <circle cx="580" cy="340" r="280" fill="url(#well-b)" />
  <circle cx="220" cy="340" r="140" fill="url(#well-a)" />

  <!-- ================= AXIS OF CENTERS (Line of Centers) ================= -->
  <line x1="30" y1="340" x2="950" y2="340" class="axis-line" marker-end="url(#arrow-axis)" />
  <text x="910" y="332" class="zone-tag" fill="#64748b">Axis of Centers</text>

  <!-- ================= ORBITS AROUND BARYCENTER ================= -->
  <!-- Barycenter CoM at (544, 340) -->
  <!-- Orbit of Body A (radius = 324) -->
  <circle cx="544" cy="340" r="324" class="orbit-a" />
  <!-- Orbit of Body B (radius = 36) -->
  <circle cx="544" cy="340" r="36" class="orbit-b" />

  <!-- ================= HILL SPHERE OF BODY A (r_H = 120) ================= -->
  <circle cx="220" cy="340" r="120" class="hill-sphere" />
  <text x="145" y="240" class="zone-tag" fill="#fbbf24">Hill Sphere (r_H = 120px)</text>

  <!-- ================= ROCHE EQUIPOTENTIAL LOBES (Figure-8 through L1) ================= -->
  <!-- Lobe A (radius approx 120) and Lobe B (radius approx 240) meeting at L1 (340, 340) -->
  <path d="M 340 340 C 340 260, 270 220, 220 220 C 150 220, 100 270, 100 340 C 100 410, 150 460, 220 460 C 270 460, 340 420, 340 340 C 340 220, 440 160, 580 160 C 720 160, 820 240, 820 340 C 820 440, 720 520, 580 520 C 440 520, 340 460, 340 340 Z" class="roche-lobe" />
  <text x="440" y="195" class="zone-tag" fill="#818cf8">Critical Roche Lobe (Jacobi Potential C_L1)</text>

  <!-- ================= EQUILATERAL TRIANGLES TO L4 / L5 ================= -->
  <!-- Line CA to L4 -->
  <line x1="220" y1="340" x2="400" y2="28.23" class="tri-line" />
  <!-- Line CB to L4 -->
  <line x1="580" y1="340" x2="400" y2="28.23" class="tri-line" />
  <!-- Line CA to L5 -->
  <line x1="220" y1="340" x2="400" y2="651.77" class="tri-line" />
  <!-- Line CB to L5 -->
  <line x1="580" y1="340" x2="400" y2="651.77" class="tri-line" />

  <!-- ================= 5 LAGRANGE POINTS (L1 - L5) ================= -->
  <!-- L1: Collinear Saddle Point at (340, 340) -->
  <circle cx="340" cy="340" r="4.5" class="lagrange-pt" />
  <text x="330" y="325" class="sub-label" fill="#c084fc" font-weight="700">L₁</text>

  <!-- L2: Outer Collinear Point at (100, 340) -->
  <circle cx="100" cy="340" r="4.5" class="lagrange-pt" />
  <text x="92" y="325" class="sub-label" fill="#c084fc" font-weight="700">L₂</text>

  <!-- L3: Opposition Point at (904, 340) -->
  <circle cx="904" cy="340" r="4.5" class="lagrange-pt" />
  <text x="896" y="325" class="sub-label" fill="#c084fc" font-weight="700">L₃</text>

  <!-- L4: Leading Triangular Point (60° Ahead) at (400, 28.23) -->
  <circle cx="400" cy="28.23" r="5" class="lagrange-pt" />
  <text x="414" y="24" class="sub-label" fill="#c084fc" font-weight="700">L₄ (Leading +60°)</text>

  <!-- L5: Trailing Triangular Point (60° Behind) at (400, 651.77) -->
  <circle cx="400" cy="651.77" r="5" class="lagrange-pt" />
  <text x="412" y="655" class="sub-label" fill="#c084fc" font-weight="700">L₅ (Trailing 60°)</text>


  <!-- ================= 2 PHYSICAL BODIES ================= -->
  <!-- Body B: Center (580, 340), R = 45, Mass = 9 -->
  <circle cx="580" cy="340" r="45" class="body-b" />
  <circle cx="580" cy="340" r="3" fill="#38bdf8" />
  <text x="545" y="405" class="text-label" fill="#38bdf8">Body B (M=9, R=45)</text>

  <!-- Body A: Center (220, 340), R = 16, Mass = 1 -->
  <circle cx="220" cy="340" r="16" class="body-a" />
  <circle cx="220" cy="340" r="2.5" fill="#4ade80" />
  <text x="175" y="375" class="text-label" fill="#4ade80">Body A (m=1, R=16)</text>


  <!-- ================= BARYCENTER (CENTER OF MASS) ================= -->
  <!-- CoM at (544, 340) inside Body B -->
  <circle cx="544" cy="340" r="4.5" class="barycenter" />
  <text x="515" y="325" class="sub-label" fill="#fbbf24" font-weight="700">Barycenter (CoM)</text>
  <text x="510" y="310" class="zone-tag" fill="#fbbf24">x = 544 (Inside B)</text>


  <!-- ================= FORCE & VELOCITY VECTORS ================= -->
  <!-- Gravitational Pull F_BA on A towards B -->
  <line x1="220" y1="340" x2="300" y2="340" class="vec-force" marker-end="url(#arrow-force)" />
  <text x="235" y="332" class="zone-tag" fill="#f43f5e">F_grav = G·m₁·m₂/d²</text>

  <!-- Gravitational Pull F_AB on B towards A -->
  <line x1="580" y1="340" x2="500" y2="340" class="vec-force" marker-end="url(#arrow-force)" />

  <!-- Orbital Velocity of A: v_A pointing UP -->
  <line x1="220" y1="340" x2="220" y2="260" class="vec-vel" marker-end="url(#arrow-vel)" />
  <text x="145" y="295" class="sub-label" fill="#38bdf8">v_A = ω·r_A</text>

  <!-- Orbital Velocity of B: v_B pointing DOWN (1/9 scale of v_A) -->
  <line x1="580" y1="340" x2="580" y2="380" class="vec-vel" marker-end="url(#arrow-vel)" />
  <text x="590" y="370" class="sub-label" fill="#38bdf8">v_B = ω·r_B</text>


  <!-- ================= DISTANCE MEASUREMENT ================= -->
  <line x1="220" y1="480" x2="580" y2="480" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 2" />
  <line x1="220" y1="472" x2="220" y2="488" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="580" y1="472" x2="580" y2="488" stroke="#94a3b8" stroke-width="1.5" />
  <text x="360" y="475" class="sub-label" fill="#cbd5e1" font-weight="600">Separation Distance d = 360 px</text>


  <!-- Legend -->
  <g transform="translate(40, 42)">
    <text x="0" y="0" class="text-title" style="font-size: 15px;">Two-Body Gravitational Dynamics &amp; Lagrange Geometry</text>
    <line x1="0" y1="18" x2="25" y2="18" stroke="#f43f5e" stroke-width="2.5" />
    <text x="35" y="22" class="sub-label" fill="#f43f5e">Gravitational Force: F = G·m₁·m₂ / d² (Relative Accel a_rel = G(m₁+m₂)/d²)</text>
    <line x1="0" y1="34" x2="25" y2="34" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4" />
    <text x="35" y="38" class="sub-label" fill="#38bdf8">Barycentric Orbits: r_A = 324px (90%), r_B = 36px (10%)</text>
    <line x1="0" y1="50" x2="25" y2="50" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 3" />
    <text x="35" y="54" class="sub-label" fill="#fbbf24">Hill Sphere of Body A: r_H = d·(m_A / 3m_B)^(1/3) = 120px</text>
    <circle cx="12" cy="66" r="4" fill="#c084fc" stroke="#fff" stroke-width="1" />
    <text x="35" y="70" class="sub-label" fill="#c084fc">Lagrange Equilibrium Points: Collinear (L₁, L₂, L₃) &amp; Triangular (L₄, L₅ at ±60°)</text>
  </g>
</svg>
