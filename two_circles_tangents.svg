<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="920" height="620">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4ade80" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f43f5e" />
    </marker>
    <marker id="arrow-axis" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#38bdf8" />
    </marker>
  </defs>

  <style>
    .bg { fill: #070a13; }
    .axis-line {
      stroke: #38bdf8;
      stroke-width: 0.5;
      stroke-dasharray: 8 5;
      opacity: 0.65;
    }
    .circle-base {
      fill: #0f172a;
      stroke: #1e293b;
      stroke-width: 1.5;
    }
    .tangent-ext {
      stroke: rgba(74, 222, 128, 0.4);
      stroke-width: 0.5;
    }
    .tangent-int {
      stroke: rgba(244, 63, 94, 0.4);
      stroke-width: 0.5;
    }
    .tangent-l0b {
      stroke: #38bdf8;
      stroke-width: 0.8;
      stroke-dasharray: 5 3;
      opacity: 0.85;
    }
    .arc-facing-b {
      stroke: #38bdf8;
      stroke-width: 4;
      fill: none;
    }
    .arc-facing-a {
      stroke: #38bdf8;
      stroke-width: 3.5;
      fill: none;
    }
    .arc-umbra {
      stroke: #64748b;
      stroke-width: 3.5;
      fill: none;
    }
    .arc-penumbra {
      stroke: #fbbf24;
      stroke-width: 3.5;
      fill: none;
    }
    .vec-ext {
      stroke: #4ade80;
      stroke-width: 2;
    }
    .vec-int {
      stroke: #f43f5e;
      stroke-width: 2;
    }
    .focal-pt {
      fill: #ffb700;
      stroke: #ffffff;
      stroke-width: 1.5;
    }
    .point {
      fill: #ffffff;
      stroke-width: 1.5;
    }
    .text-title {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 16px;
      font-weight: 700;
      fill: #f8fafc;
    }
    .text-label {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
    }
    .sub-label {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 11px;
    }
    .zone-tag {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 10px;
      font-weight: 600;
    }
  </style>

  <!-- Background -->
  <rect width="920" height="620" class="bg" />


  <!-- ================= 4 TANGENT LINES ================= -->
  <!-- 1. External Tangent Top (L1) -->
  <line x1="80" y1="318.10" x2="850" y2="56.73" class="tangent-ext" />

  <!-- 2. External Tangent Bottom (L2) -->
  <line x1="80" y1="281.90" x2="850" y2="543.27" class="tangent-ext" />

  <!-- 3. Internal Transverse Tangent (L3) -->
  <line x1="80" y1="240.97" x2="850" y2="569.92" class="tangent-int" />

  <!-- 4. Internal Transverse Tangent (L4) -->
  <line x1="80" y1="359.03" x2="850" y2="30.08" class="tangent-int" />

  <!-- ================= 2 TANGENT LINES FROM L0B TO CIRCLE A ================= -->
  <line x1="80" y1="279.41" x2="460" y2="299.44" class="tangent-l0b" />
  <line x1="80" y1="320.59" x2="460" y2="300.56" class="tangent-l0b" />


  <!-- ================= 2 BASE CIRCLES ================= -->
  <!-- Circle A: Center (180, 300), R = 15 -->
  <circle cx="180" cy="300" r="15" class="circle-base" />

  <!-- Circle B: Center (600, 300), R = 150 -->
  <circle cx="600" cy="300" r="150" class="circle-base" />


  <!-- ================= CIRCLE B ARCS ================= -->
  <!-- Facing Arc [L1B, L2B] CCW on B -->
  <path d="M 600 300 L 551.79 157.96 A 150 150 0 0 0 551.79 442.04 Z" fill="rgba(56, 189, 248, 0.05)" />
  <path d="M 551.79 157.96 A 150 150 0 0 0 551.79 442.04" class="arc-facing-b" />

  <!-- Inner Facing Arc [L4B, L3B] CCW on B -->
  <path d="M 541.07 162.06 A 150 150 0 0 0 541.07 437.94" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="6 3" fill="none" />


  <!-- ================= CIRCLE A 4-ZONE SHADOW/LIGHT DECOMPOSITION ================= -->
  <!-- 1. Total Shadow (Umbra): L1A -> CCW -> L2A -->
  <path d="M 180 300 L 175.18 285.80 A 15 15 0 0 0 175.18 314.20 Z" fill="rgba(100, 116, 139, 0.25)" />
  <path d="M 175.18 285.80 A 15 15 0 0 0 175.18 314.20" class="arc-umbra" />

  <!-- 2. Gradient Shadow Top (Penumbra): L3A -> CCW -> L1A -->
  <path d="M 180 300 L 185.89 286.21 A 15 15 0 0 0 175.18 285.80 Z" fill="rgba(251, 191, 36, 0.2)" />
  <path d="M 185.89 286.21 A 15 15 0 0 0 175.18 285.80" class="arc-penumbra" />

  <!-- 3. Gradient Shadow Bottom (Penumbra): L4A -> CW -> L2A -->
  <path d="M 180 300 L 175.18 314.20 A 15 15 0 0 0 185.89 313.79 Z" fill="rgba(251, 191, 36, 0.2)" />
  <path d="M 175.18 314.20 A 15 15 0 0 0 185.89 313.79" class="arc-penumbra" />

  <!-- 4. Full Light / Facing Arc: L4A -> CCW -> L3A -->
  <path d="M 180 300 L 185.89 313.79 A 15 15 0 0 0 185.89 286.21 Z" fill="rgba(56, 189, 248, 0.3)" />
  <path d="M 185.89 313.79 A 15 15 0 0 0 185.89 286.21" class="arc-facing-a" />


  <!-- ================= FOCAL POINTS (S_ext and S_int) ================= -->
  <!-- S_ext (L1 x L2: Past arc at x=133.33) -->
  <circle cx="133.33" cy="300" r="4.5" class="focal-pt" />
  <text x="75" y="275" class="sub-label" fill="#ffb700">S_ext (L₁ × L₂)</text>
  <text x="60" y="290" class="zone-tag" fill="#94a3b8">Past Arc (No Flip)</text>

  <!-- S_int (L3 x L4: Focal point before arc at x=218.18) -->
  <circle cx="218.18" cy="300" r="4.5" class="focal-pt" />
  <text x="228" y="280" class="sub-label" fill="#ffb700">S_int (L₃ × L₄)</text>
  <text x="228" y="295" class="zone-tag" fill="#fb7185">Focal Crossover (Flips Direction)</text>


  <!-- ================= RADIAL VECTORS FROM CENTERS ================= -->
  <!-- On Circle A -->
  <line x1="180" y1="300" x2="175.6" y2="287.0" class="vec-ext" marker-end="url(#arrow-green)" />
  <line x1="180" y1="300" x2="175.6" y2="313.0" class="vec-ext" marker-end="url(#arrow-green)" />
  <line x1="180" y1="300" x2="185.4" y2="287.3" class="vec-int" marker-end="url(#arrow-red)" />
  <line x1="180" y1="300" x2="185.4" y2="312.7" class="vec-int" marker-end="url(#arrow-red)" />

  <!-- On Circle B -->
  <line x1="600" y1="300" x2="553.5" y2="163.0" class="vec-ext" style="stroke-width:2.5;" marker-end="url(#arrow-green)" />
  <line x1="600" y1="300" x2="553.5" y2="437.0" class="vec-ext" style="stroke-width:2.5;" marker-end="url(#arrow-green)" />
  <line x1="600" y1="300" x2="543.5" y2="167.5" class="vec-int" style="stroke-width:2.5;" marker-end="url(#arrow-red)" />
  <line x1="600" y1="300" x2="543.5" y2="432.5" class="vec-int" style="stroke-width:2.5;" marker-end="url(#arrow-red)" />

  <!-- ================= AXIS OF CENTERS (CA - CB LINE) ================= -->
  <line x1="40" y1="300" x2="880" y2="300" class="axis-line" marker-end="url(#arrow-axis)" />
  <text x="835" y="292" class="zone-tag" fill="#38bdf8">Axis (CA–CB)</text>


  <!-- ================= CONTACT POINTS & CENTERS ================= -->
  <!-- Centers -->
  <circle cx="180" cy="300" r="3.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />
  <text x="140" y="340" class="text-label">Circle A (R=15)</text>

  <circle cx="600" cy="300" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />
  <text x="615" y="305" class="text-label">Circle B (R=150)</text>

  <!-- Contact Points on A -->
  <circle cx="175.18" cy="285.80" r="3.5" class="point" stroke="#4ade80" />
  <text x="145" y="275" class="sub-label" fill="#4ade80">L₁A</text>

  <circle cx="175.18" cy="314.20" r="3.5" class="point" stroke="#4ade80" />
  <text x="145" y="330" class="sub-label" fill="#4ade80">L₂A</text>

  <circle cx="185.89" cy="286.21" r="3.5" class="point" stroke="#f43f5e" />
  <text x="195" y="275" class="sub-label" fill="#f43f5e">L₃A</text>

  <circle cx="185.89" cy="313.79" r="3.5" class="point" stroke="#f43f5e" />
  <text x="195" y="330" class="sub-label" fill="#f43f5e">L₄A</text>

  <!-- Contact Points on Circle A from L0B Tangents -->
  <circle cx="180.83" cy="285.02" r="3" class="point" stroke="#38bdf8" />
  <circle cx="180.83" cy="314.98" r="3" class="point" stroke="#38bdf8" />

  <!-- Contact Points on B -->
  <circle cx="551.79" cy="157.96" r="4.5" class="point" stroke="#4ade80" />
  <text x="525" y="150" class="sub-label" fill="#4ade80">L₁B</text>

  <circle cx="551.79" cy="442.04" r="4.5" class="point" stroke="#4ade80" />
  <text x="525" y="455" class="sub-label" fill="#4ade80">L₂B</text>

  <circle cx="541.07" cy="162.06" r="4.5" class="point" stroke="#f43f5e" />
  <text x="508" y="172" class="sub-label" fill="#f43f5e">L₄B</text>

  <circle cx="541.07" cy="437.94" r="4.5" class="point" stroke="#f43f5e" />
  <text x="508" y="435" class="sub-label" fill="#f43f5e">L₃B</text>

  <!-- Point L0B on Circle B (Intersection with Axis on Facing Arc) -->
  <circle cx="450" cy="300" r="4.5" class="point" stroke="#38bdf8" stroke-width="2" />
  <text x="458" y="292" class="sub-label" fill="#38bdf8" font-weight="700">L₀B</text>


  <!-- ================= LEGEND & OPTICAL ZONES ================= -->
  <g transform="translate(40, 45)">
    <text x="0" y="0" class="text-title">Projective Occlusion, Optical Axis &amp; Shadow Zones</text>
    
    <!-- Total Shadow -->
    <line x1="0" y1="20" x2="25" y2="20" stroke="#64748b" stroke-width="3" />
    <text x="35" y="24" class="sub-label" fill="#cbd5e1">Total Shadow (Umbra): L₁A → CCW → L₂A (Δθ = 142.5°)</text>

    <!-- Gradient Shadows -->
    <line x1="0" y1="38" x2="25" y2="38" stroke="#fbbf24" stroke-width="3" />
    <text x="35" y="42" class="sub-label" fill="#fbbf24">Gradient Shadows (Penumbra): L₃A → CCW → L₁A &amp; L₄A → CW → L₂A (2 × 41.9°)</text>

    <!-- Full Light -->
    <line x1="0" y1="56" x2="25" y2="56" stroke="#38bdf8" stroke-width="3" />
    <text x="35" y="60" class="sub-label" fill="#38bdf8">Full Light / Direct Sight: L₄A → CCW → L₃A (Facing B, Δθ = 133.7°)</text>

    <!-- L0B Tangents -->
    <line x1="0" y1="74" x2="25" y2="74" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2" />
    <text x="35" y="78" class="sub-label" fill="#7dd3fc">Tangents from L₀B to Circle A (Apex Horizon from L₀B)</text>
  </g>
</svg>
